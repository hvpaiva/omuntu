name: CI

on:
  push:
  pull_request:
    branches: [dev]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck on all scripts
        run: |
          echo "ShellCheck version: $(shellcheck --version | head -2 | tail -1)"
          echo "Checking scripts..."
          shellcheck --severity=style \
            bin/omuntu-* \
            $(find install/ -name '*.sh' -type f) \
            boot.sh install.sh \
            default/bash/rc default/bash/envs default/bash/aliases \
            default/bash/shell default/bash/init default/bash/functions \
            default/bashrc default/bash/fns/* \
            default/waybar/indicators/*.sh \
            default/systemd/system-sleep/unmount-fuse \
            config/omuntu/extensions/menu.sh
          echo "All scripts passed ShellCheck."

  validate-apt:
    name: Validate APT Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PPAs and third-party repos
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:cppiber/hyprland
          sudo add-apt-repository -y ppa:mkasberg/ghostty-ubuntu
          sudo add-apt-repository -y ppa:zhangsongcui3371/fastfetch
          sudo add-apt-repository -y ppa:dotnet/backports
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update

      - name: Validate package names
        run: |
          failures=()
          for file in install/packages/apt.packages install/packages/ppa.packages; do
            while IFS= read -r pkg; do
              if ! apt-cache show "$pkg" > /dev/null 2>&1; then
                echo "::error file=${file}::Package not found in configured repos: ${pkg}"
                failures+=("${file}:${pkg}")
              fi
            done < <(grep -v '^\s*#' "$file" | grep -v '^\s*$' | sed 's/\s*#.*//')
          done

          if (( ${#failures[@]} > 0 )); then
            echo ""
            echo "=== VALIDATION FAILED ==="
            echo "The following packages were not found:"
            printf '  - %s\n' "${failures[@]}"
            exit 1
          fi
          echo "All APT packages validated successfully."

  validate-flatpak:
    name: Validate Flatpak Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Flatpak app IDs
        run: |
          failures=()
          while IFS= read -r app_id; do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://flathub.org/api/v2/appstream/${app_id}")
            if [[ $status != "200" ]]; then
              echo "::error file=install/packages/flatpak.packages::Flatpak app not found on Flathub: ${app_id} (HTTP ${status})"
              failures+=("$app_id")
            fi
          done < <(grep -v '^\s*#' install/packages/flatpak.packages | grep -v '^\s*$')

          if (( ${#failures[@]} > 0 )); then
            echo ""
            echo "=== VALIDATION FAILED ==="
            echo "The following Flatpak app IDs were not found on Flathub:"
            printf '  - %s\n' "${failures[@]}"
            exit 1
          fi
          echo "All Flatpak packages validated successfully."

  validate-cargo:
    name: Validate Cargo Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate crate names
        run: |
          failures=()
          while IFS= read -r crate; do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: omuntu-ci-validator (https://github.com/hvpaiva/omuntu)" \
              "https://crates.io/api/v1/crates/${crate}")
            if [[ $status != "200" ]]; then
              echo "::error file=install/packages/cargo.packages::Crate not found on crates.io: ${crate} (HTTP ${status})"
              failures+=("$crate")
            fi
            sleep 1  # crates.io rate limit: 1 request/second
          done < <(grep -v '^\s*#' install/packages/cargo.packages | grep -v '^\s*$')

          if (( ${#failures[@]} > 0 )); then
            echo ""
            echo "=== VALIDATION FAILED ==="
            echo "The following crate names were not found on crates.io:"
            printf '  - %s\n' "${failures[@]}"
            exit 1
          fi
          echo "All cargo packages validated successfully."

  validate-pip:
    name: Validate Pip Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PyPI package names
        run: |
          failures=()
          while IFS= read -r pkg; do
            if ! pip index versions "$pkg" > /dev/null 2>&1; then
              echo "::error file=install/packages/pip.packages::Package not found on PyPI: ${pkg}"
              failures+=("$pkg")
            fi
          done < <(grep -v '^\s*#' install/packages/pip.packages | grep -v '^\s*$')

          if (( ${#failures[@]} > 0 )); then
            echo ""
            echo "=== VALIDATION FAILED ==="
            echo "The following packages were not found on PyPI:"
            printf '  - %s\n' "${failures[@]}"
            exit 1
          fi
          echo "All pip packages validated successfully."
